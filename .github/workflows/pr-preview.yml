name: PR preview build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 fonts-liberation

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf]"

      - name: Run tests
        run: pytest -q

      - name: Build site (PR check, incl. PDF)
        run: python build.py

      - name: Smoke checks
        run: |
          test -f dist/index.html
          test -f dist/de/index.html
          test -f dist/de/erlasse/index.html
          test -f dist/de/gerichtsentscheide/index.html
          test -f dist/de/ki-konzepte/index.html
          test -f dist/de/opencaselaw-connector/index.html
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/assets/pdf/leitfaden.pdf
          test -s dist/llms.txt
          test -s dist/llms-full.txt
          test -s dist/assets/pdf/leitfaden.pdf

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist/
          retention-days: 14
