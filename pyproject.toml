[project]
name = "swiss-legal-research-guide"
version = "1.0.0"
description = "Static-site build for the Ehrenzeller/Brugger guide to Swiss legal research."
requires-python = ">=3.12"
dependencies = [
    "mistune>=3.0.2",
    "Jinja2>=3.1.4",
    "PyYAML>=6.0.2",
    "Pygments>=2.18.0",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
pdf = [
    "weasyprint>=62.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
